services:
  api:
    build: .
    container_name: trader-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      TZ: Asia/Tokyo
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/trader.db}
      MOOMOO_OPEND_HOST: ${MOOMOO_OPEND_HOST:-opend}
      MOOMOO_OPEND_PORT: ${MOOMOO_OPEND_PORT:-11111}
    volumes:
      - backend_data:/app/data
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    container_name: twitter_worker
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      API_BASE_URL: http://api:8000
      TZ: Asia/Tokyo
    depends_on: [api]
    volumes:
      - ./:/app
    command: bash -lc "python -m workers.twitter_poll"

  opend:
    build:
      context: ..
      dockerfile: backend/opend/Dockerfile
    container_name: moomoo-opend
    profiles: [moomoo]  # only start with: docker compose --profile moomoo up
    ports:
      - "11111:11111"
      - "22222:22222"
    env_file:
      - .env
    volumes:
      - ./opend_data:/opt/opend/FutuOpenD/Log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11111'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  backend_data:
